<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Presto Redesign Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../proto.css">
  <style>:root { --brand: #4c7f2e; --brand-soft: rgba(76, 127, 46, 0.14); }
    .pr { display: flex; flex-direction: column; height: 100%; font-family: 'Poppins', system-ui, sans-serif; font-size: 13.5px; background: #f4f5f2; }
    .pr-top { display: flex; align-items: center; gap: 10px; padding: 42px 16px 12px; background: #4c7f2e; color: #fff; }
    .pr-top h2 { font-size: 16px; font-weight: 600; flex: 1; }
    .pr-top button { background: none; border: 0; color: #fff; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; }
    .pr-top button:hover { background: rgba(255,255,255,0.15); }
    .pr-top svg { width: 18px; height: 18px; }
    .pr-body { flex: 1; overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start; }
    .pr-card { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 4px 14px rgba(0,0,0,0.05); }
    .pr-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .pr-note { font-size: 12px; color: #5b6359; line-height: 1.5; }
    .pr-field { display: grid; gap: 5px; margin-bottom: 10px; }
    .pr-field label { font-size: 12px; font-weight: 500; color: #3b4239; }
    .pr-field input, .pr-field select { height: 40px; border-radius: 9px; border: 1.5px solid #cfd5cb; padding: 0 11px; font: inherit; background: #fff; color: #1d1d1d; }
    .pr-field input:focus { outline: none; border-color: #4c7f2e; box-shadow: 0 0 0 3px rgba(76,127,46,0.15); }
    .pr-field.err input { border-color: #c62828; background: #fff6f6; }
    .pr-field .msg { font-size: 11.5px; color: #c62828; }
    .pr-btn { height: 44px; border-radius: 10px; border: 0; background: #4c7f2e; color: #fff; font-weight: 600; font-size: 14px; width: 100%; }
    .pr-btn:hover { background: #426f27; }
    .pr-btn.ghost { background: #fff; color: #4c7f2e; border: 1.5px solid #4c7f2e; }
    .pr-btn:disabled { background: #b9c4b3; }
    .pr-presto { border-radius: 16px; padding: 16px; color: #fff; background: linear-gradient(135deg, #2f5d1a, #5c9a37); position: relative; overflow: hidden; min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; }
    .pr-presto::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,0.08); }
    .pr-presto .logo { font-weight: 700; letter-spacing: 0.08em; font-size: 15px; }
    .pr-presto .bal { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
    .pr-presto .num { font-size: 12px; opacity: 0.85; letter-spacing: 0.08em; }
    .pr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pr-tile { background: #fff; border: 0; border-radius: 12px; padding: 12px; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,0.06); display: grid; gap: 6px; }
    .pr-tile:hover { box-shadow: 0 0 0 2px #4c7f2e; }
    .pr-tile svg { width: 20px; height: 20px; color: #4c7f2e; }
    .pr-tile b { font-size: 13px; font-weight: 600; }
    .pr-tile span { font-size: 11.5px; color: #5b6359; }
    .pr-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pr-chip { height: 42px; border-radius: 10px; border: 1.5px solid #cfd5cb; background: #fff; font-weight: 600; }
    .pr-chip.on { border-color: #4c7f2e; background: #eef5e9; color: #2f5d1a; }
    .pr-radio { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 10px; border: 1.5px solid #cfd5cb; background: #fff; width: 100%; text-align: left; }
    .pr-radio.on { border-color: #4c7f2e; background: #eef5e9; }
    .pr-radio i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #9aa596; flex-shrink: 0; }
    .pr-radio.on i { border-color: #4c7f2e; box-shadow: inset 0 0 0 3px #fff; background: #4c7f2e; }
    .pr-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eceee9; font-size: 12.5px; }
    .pr-row:last-child { border-bottom: 0; }
    .pr-done { display: grid; place-items: center; text-align: center; gap: 10px; padding: 26px 10px; }
    .pr-done .ok { width: 64px; height: 64px; border-radius: 50%; background: #eef5e9; color: #4c7f2e; display: grid; place-items: center; }
    .pr-done .ok svg { width: 32px; height: 32px; }
    .pr-tos { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 22px; }
    .pr-tos h2 { font-size: 22px; font-weight: 600; color: #2f5d1a; }
  </style>
</head>
<body>
  <script src="../../analytics.js"></script>
  <script src="../proto.js"></script>
  <script src="app.js"></script>
</body>
</html>
